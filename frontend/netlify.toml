# Netlify: the whole site, including management (/manage). Every /api request
# is proxied to the backend on schul-staging through its HTTPS gateway:
#
#   browser -> Netlify -> Cloudflare (rip-daktari.schul.co.ke:8443) -> Caddy -> app
#
# The gateway (deploy/staging/Caddyfile.tls) sends /api/manage/* to the
# management listener (sign-in required; requests must come from this site)
# and everything else to the public listener.
#
# This file lives in frontend/, so in the Netlify UI set "Base directory" to
# `frontend` (Netlify then reads this file). `publish` is relative to `base`.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Same Node line as the Dockerfile's build stage (node:22.21-trixie-slim).
  NODE_VERSION = "22.21"

# Rules are matched top to bottom; the first match wins. Proxies (status 200)
# keep the browser on this site: no CORS, and `connect-src 'self'` holds.

# 1. Every API request goes to the backend's HTTPS gateway.
[[redirects]]
  from = "/api/*"
  to = "https://rip-daktari.schul.co.ke:8443/api/:splat"
  status = 200
  force = true

# 2. Single-page app: every other path (including /manage) renders index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same security headers the backend sends with the page (backend/src/api/mod.rs).
# Netlify does not add these to proxied responses; the backend sends its own.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# Vite fingerprints everything under /assets, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
