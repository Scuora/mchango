# Netlify: the site, including management (/manage). Every /api request is
# proxied to the backend on schul-staging through its HTTPS gateway (Caddy on
# :8443, deploy/staging/Caddyfile.tls), which sends /api/manage/* to the
# management listener and everything else to the public one.
#
# This file lives in frontend/, so in the Netlify UI set "Base directory" to
# `frontend` (Netlify then reads this file). `publish` is relative to `base`.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Same Node line as the Dockerfile's build stage (node:22.21-trixie-slim).
  NODE_VERSION = "22.21"

# Rules are matched top to bottom; the first match wins.
#
# BACKEND ORIGIN: https://164.90.230.69:8443, the HTTPS gateway on schul-staging.
# The hop is encrypted; its certificate is the gateway's own. When the
# Cloudflare name staging-mchango.schul.co.ke exists, it can replace the address.

# 2. Public API, proxied (status 200 = rewrite) so the browser stays same-origin:
#    no CORS, and the app's `connect-src 'self'` policy holds.
[[redirects]]
  from = "/api/public/*"
  to = "https://164.90.230.69:8443/api/public/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "https://164.90.230.69:8443/api/health"
  status = 200
  force = true

# 3. Every other /api path, including management (/api/manage/*), which the
#    gateway sends to the management listener: sign-in required, and requests
#    must come from this site. Unknown paths get a JSON 404 the app understands.
[[redirects]]
  from = "/api/*"
  to = "https://164.90.230.69:8443/api/:splat"
  status = 200
  force = true

# 4. Single-page app: every other path renders index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same security headers the backend sends with the page (backend/src/api/mod.rs).
# Netlify does not add these to proxied responses; the backend sends its own.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# Vite fingerprints everything under /assets, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
