[package]
name = "mchango"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "time", "sync", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "set-header"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
regex = "=1.13.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
getrandom = "=0.4.3"
dotenvy = "=0.15.7"
argon2 = "=0.6.0"
rpassword = "=7.5.4"
tower = { version = "=0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

